name: build-desktop

# 手动触发，或推送 v* 标签时自动构建 macOS / Linux 并发布 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-14 # Apple Silicon；构建 x64 + arm64 双架构
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build dmg + zip (x64 + arm64, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest # x64 原生，交叉构建 arm64 AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage (x64 + arm64)
        run: npx electron-builder --linux --x64 --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.ref_name }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [mac, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-${{ github.ref_name }}
          path: rel

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ github.ref_name }}
          path: rel

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" rel/* --title "$GITHUB_REF_NAME" --generate-notes
