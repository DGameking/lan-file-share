name: build-mac

# 手动触发，或推送 v* 标签时自动构建 macOS dmg
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  dmg:
    runs-on: macos-14 # Apple Silicon；构建 x64 + arm64 双架构
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build dmg (x64 + arm64, unsigned)
        env:
          # 未签名构建：跳过身份查找，产物需右键打开（或设置"任何来源"）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
