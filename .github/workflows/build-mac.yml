name: build-desktop

# 手动触发，或推送 v* 标签时自动构建 macOS / Linux 并发布 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-14 # Apple Silicon；构建 x64 + arm64 双架构
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build dmg (x64 + arm64, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ github.ref_name }}
          path: |
            dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest # x64 原生，交叉构建 arm64 AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage (x64 + arm64)
        run: npx electron-builder --linux --x64 --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.ref_name }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-latest # GitHub runner 预装 Android SDK；构建 Capacitor 调试签名 APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.ref_name }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [mac, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-${{ github.ref_name }}
          path: rel

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ github.ref_name }}
          path: rel

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-${{ github.ref_name }}
          path: rel

      - name: Rename Android APK
        run: mv rel/app-debug.apk "rel/LanFileShare-${GITHUB_REF_NAME#v}-android.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" rel/* --title "$GITHUB_REF_NAME" --generate-notes
