<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>局域网共享</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--line:#e4e8f0;--txt:#1f2937;--muted:#6b7280;--accent:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.logo{width:72px;height:72px;border-radius:18px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:36px;background:#eff6ff}
h1{font-size:18px;text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:22px;line-height:1.6}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:14px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
button:active{opacity:.85}
.tip{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.7}
.tip b{color:var(--txt)}
.err{color:#dc2626;font-size:12px;min-height:16px;margin-bottom:8px;text-align:center}
.hint{display:none;background:#eff6ff;border-radius:10px;padding:10px 12px;font-size:12px;color:#1e40af;margin-bottom:14px;line-height:1.7}
</style>
</head>
<body>
<div class="card" id="shareCard" style="display:none">
  <div class="logo">📤</div>
  <h1>分享投送</h1>
  <div class="sub" id="shareDesc">检测到来自其他应用的分享内容</div>
  <div class="err" id="shareErr"></div>
  <label>投送到</label>
  <input id="shareUrl" placeholder="例如 http://192.168.1.20:8080" autocapitalize="off" autocorrect="off" spellcheck="false" />
  <div class="hint" id="shareHint"></div>
  <button id="shareGo">投 送</button>
  <div class="tip" id="shareResult" style="display:none"></div>
</div>
<div class="card" id="homeCard" style="display:none">
  <div class="logo">✅</div>
  <h1 id="homeName">已连接</h1>
  <div class="sub" id="homeAddr"></div>
  <button id="goChat">💬 进入会话</button>
  <button id="goPortal" style="background:#eef2f8;color:var(--txt);margin-top:10px">🏠 文件共享门户</button>
  <button id="goAdmin" style="background:#eef2f8;color:var(--txt);margin-top:10px">🛠 管理控制台</button>
  <div class="tip" style="text-align:center"><a href="javascript:void(0)" id="changeServer" style="color:var(--accent)">更换服务器</a></div>
</div>
<div class="card" id="connectCard">
  <div class="logo">📡</div>
  <h1>局域网共享</h1>
  <div class="sub">连接同一局域网内运行「局域网文件共享」的电脑或 NAS</div>
  <div class="hint" id="hint"></div>
  <label>服务器地址</label>
  <input id="url" placeholder="例如 http://192.168.1.20:8080" autocapitalize="off" autocorrect="off" spellcheck="false" />
  <div class="err" id="err"></div>
  <button id="go">连 接</button>
  <div class="tip">
    <b>如何获取地址？</b><br>
    电脑端：主界面顶部显示 <b>http://IP:端口</b>，或管理控制台「连接」页有二维码。<br>
    NAS 端：应用详情页显示访问地址。<br>
    两台设备必须处于<b>同一局域网</b>。
  </div>
</div>
<script>
(function(){
  var input = document.getElementById('url');
  var err = document.getElementById('err');
  var hint = document.getElementById('hint');
  var saved = localStorage.getItem('server_url');
  if (saved) input.value = saved;

  function normalize(v){
    v = (v || '').trim().replace(/\/+$/, '');
    if (!v) return '';
    if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
    return v;
  }

  function connect(){
    var url = normalize(input.value);
    err.textContent = '';
    if (!url) { err.textContent = '请输入服务器地址'; return; }
    var btn = document.getElementById('go');
    btn.textContent = '连接中…';
    // 探测 /api/self（2.5s 超时）
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, 2500);
    fetch(url + '/api/self', { signal: ctrl.signal })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(info){
        clearTimeout(t);
        if (!info || (!info.deviceName && !info.device_name)) throw new Error('not_target');
        localStorage.setItem('server_url', url);
        localStorage.setItem('server_name', info.deviceName || info.device_name || '');
        showHome(url, info.deviceName || info.device_name || '');
      })
      .catch(function(e){
        clearTimeout(t);
        btn.textContent = '连 接';
        if (e.message === 'not_target') {
          err.textContent = '该地址不是「局域网文件共享」服务';
        } else {
          err.textContent = '无法连接，请检查地址与网络';
          hint.style.display = 'block';
          hint.innerHTML = '排查建议：<br>1. 确认电脑/NAS 端软件正在运行<br>2. 确认手机与服务器连的是<b>同一个 Wi-Fi</b><br>3. 地址格式：<b>http://IP:端口</b>（端口默认 8080）<br>4. 部分路由器开启了「AP 隔离」，需在路由器关闭';
        }
      });
  }

  /* ---------- 已连接面板（App 二期：不再直接跳转，提供统一入口） ---------- */
  function showHome(url, name){
    document.getElementById('connectCard').style.display = 'none';
    var home = document.getElementById('homeCard');
    home.style.display = '';
    document.getElementById('homeName').textContent = name || '已连接';
    document.getElementById('homeAddr').textContent = url;
    document.getElementById('goChat').onclick = function(){ location.href = url + '/chat'; };
    document.getElementById('goPortal').onclick = function(){ location.href = url + '/'; };
    document.getElementById('goAdmin').onclick = function(){ location.href = url + '/admin'; };
    document.getElementById('changeServer').onclick = function(){
      home.style.display = 'none';
      document.getElementById('connectCard').style.display = '';
      input.value = url;
    };
  }
  // 启动：有保存的服务器地址 → 先探测，成功直接进面板，失败回落连接卡
  (function(){
    if (!saved) return;
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, 2500);
    fetch(saved + '/api/self', { signal: ctrl.signal })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(info){
        clearTimeout(t);
        if (info && (info.deviceName || info.device_name)) {
          showHome(saved, info.deviceName || info.device_name || '');
        }
      })
      .catch(function(){ clearTimeout(t); });
  })();

  document.getElementById('go').addEventListener('click', connect);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') connect(); });

  /* ---------- 系统分享投送（Capacitor 原生桥） ---------- */
  var pending = null; // {text, files[]}
  function fileUrl(p){
    // Capacitor webview 本地文件访问（https://localhost/_capacitor_file_/...）
    return window.Capacitor && window.Capacitor.convertFileSrc
      ? window.Capacitor.convertFileSrc(p) : p;
  }
  function fmtSize(n){
    if (n > 1073741824) return (n/1073741824).toFixed(1)+'GB';
    if (n > 1048576) return (n/1048576).toFixed(1)+'MB';
    if (n > 1024) return (n/1024).toFixed(0)+'KB';
    return n+'B';
  }
  function initShare(){
    if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.ShareIntent) return;
    var P = window.Capacitor.Plugins.ShareIntent;
    P.getPending().then(function(r){
      if (!r || !r.has) return;
      pending = { text: r.text || '', files: r.files || [] };
      if (!pending.text && !pending.files.length) return;
      document.getElementById('connectCard').style.display = 'none';
      document.getElementById('shareCard').style.display = '';
      var saved = localStorage.getItem('server_url') || '';
      document.getElementById('shareUrl').value = saved;
      var parts = [];
      if (pending.text) parts.push('文本（' + pending.text.length + ' 字）');
      for (var i = 0; i < pending.files.length; i++) parts.push(pending.files[i].split('/').pop());
      document.getElementById('shareDesc').textContent = '待投送：' + parts.join('、');
    }).catch(function(){});
  }
  function uploadShare(){
    var err = document.getElementById('shareErr');
    var btn = document.getElementById('shareGo');
    var res = document.getElementById('shareResult');
    err.textContent = '';
    res.style.display = 'none';
    var v = (document.getElementById('shareUrl').value || '').trim().replace(/\/+$/, '');
    if (!v) { err.textContent = '请输入服务器地址'; return; }
    if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
    localStorage.setItem('server_url', v);
    btn.textContent = '连接服务器…';
    btn.disabled = true;
    fetch(v + '/api/self').then(function(r){ if (!r.ok) throw new Error('bad'); return r.json(); }).then(function(info){
      if (!info || !info.deviceId) throw new Error('bad');
      btn.textContent = '投送中…';
      var from = 'Android';
      var chain = Promise.resolve();
      var ok = 0, fail = 0;
      pending.files.forEach(function(p){
        chain = chain.then(function(){
          var name = p.split('/').pop();
          return fetch(fileUrl(p)).then(function(fr){ return fr.blob(); }).then(function(blob){
            var fd = new FormData();
            fd.append('file', blob, name);
            return fetch(v + '/api/drop?from=' + encodeURIComponent(from), { method: 'POST', body: fd });
          }).then(function(up){ if (up.ok) ok++; else fail++; });
        }).catch(function(){ fail++; });
      });
      if (pending.text) {
        chain = chain.then(function(){
          return fetch(v + '/api/drop?from=' + encodeURIComponent(from), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: pending.text, from: from })
          }).then(function(up){ if (up.ok) ok++; else fail++; }).catch(function(){ fail++; });
        });
      }
      chain.then(function(){
        btn.textContent = '投 送';
        btn.disabled = false;
        localStorage.setItem('server_name', info.deviceName || '');
        res.style.display = '';
        res.innerHTML = (fail ? ('⚠️ 成功 ' + ok + ' 个，失败 ' + fail + ' 个<br>（大文件失败可到电脑端开启后再试）')
                              : ('✅ 已投送 ' + ok + ' 项到「' + (info.deviceName || '服务器') + '」')) +
                        '<br><span style="color:var(--muted)">本窗口可以关闭了</span>';
        // 清理缓存文件（下次分享会重新写入）
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) { /* 预留 */ }
      });
    }).catch(function(){
      btn.textContent = '投 送';
      btn.disabled = false;
      err.textContent = '无法连接服务器，请检查地址与网络';
      document.getElementById('shareHint').style.display = 'block';
    });
  }
  document.getElementById('shareGo').addEventListener('click', uploadShare);
  document.getElementById('shareUrl').addEventListener('keydown', function(e){ if (e.key === 'Enter') uploadShare(); });
  initShare();
})();
</script>
</body>
</html>
